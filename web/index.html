<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RetailAssist</title>
<style>body{font:17px system-ui;background:#f1f5f9;color:#163044;max-width:850px;margin:4rem auto;padding:1rem}textarea,input,select,button{font:inherit;padding:.7rem;border:1px solid #aab8c5;border-radius:8px}textarea{display:block;width:95%;height:90px}button{background:#126b68;color:white;cursor:pointer}article{background:white;border-radius:12px;padding:1.2rem;margin:1rem 0}label{display:inline-block;margin:.7rem 0}pre{white-space:pre-wrap}small{color:#506476}</style>
<h1>RetailAssist</h1><p>Find products by meaning and budget.</p><small>Historical Flipkart catalogue. Prices in INR. Stock unknown. Confirm with the retailer before purchasing.</small>
<form id="form"><label for="q">What are you looking for?</label><textarea id="q" required>I need comfortable running shoes under INR 1500</textarea><label>Maximum INR <input id="budget" type="number" min="1"></label> <label>Method <select id="method"><option>hybrid</option><option>semantic</option><option>tfidf</option><option>lsa</option></select></label> <button>Find products</button></form><p id="status" role="status"></p><div id="results"></div>
<script>const form=document.getElementById('form'),results=document.getElementById('results'),status=document.getElementById('status');form.onsubmit=async e=>{e.preventDefault();results.replaceChildren();status.textContent='Searching…';try{const budget=document.getElementById('budget').value;const r=await fetch('/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.getElementById('q').value,method:document.getElementById('method').value,constraints:budget?{max_price:Number(budget)}:{}})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d.detail));status.textContent=d.notice;const a=document.createElement('article'),p=document.createElement('pre');p.textContent=d.answer;a.append(p);results.append(a)}catch(err){status.textContent=err.message}};</script></html>
