[project]
name = "retailassist-healthyu-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.165.0", "httpx==0.28.1", "pydantic==2.14.4", "numpy==2.5.5", "uvicorn==0.54.0"]
[tool.vercel]
entrypoint = "app:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
