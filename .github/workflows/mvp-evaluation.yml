name: MVP evaluation evidence (manual)
on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: Reviewed human-labelled query JSON under research/mvp
        required: true
        default: research/mvp/queries.reviewed.json
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    env:
      QUERIES_FILE: ${{ inputs.queries_file }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require reviewed labels and source artifacts
        run: |
          case "$QUERIES_FILE" in research/mvp/*.json) ;; *) exit 1 ;; esac
          test -f "$QUERIES_FILE"
          test -f apps/api/catalogue/manifest.json
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python scripts/mvp/evaluate.py --queries "$QUERIES_FILE" --confirm-human-labels
      - uses: actions/upload-artifact@v4
        with:
          name: actual-mvp-evaluation
          path: reports/mvp/results/
