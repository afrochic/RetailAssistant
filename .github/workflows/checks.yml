name: Legacy Flipkart validation (manual only)
on: workflow_dispatch
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: pytest -q
      - name: Restore serving artifacts without training
        run: python -m retailassist.bootstrap
      - name: Check restored serving artifacts
        run: python scripts/check_bootstrap.py
